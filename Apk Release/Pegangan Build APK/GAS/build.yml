name: GAS Build Reference

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build ${{ matrix.display }} debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Siswa
            task: Siswa
            output_dir: siswa
          - display: Guru
            task: Guru
            output_dir: guru
          - display: Kepala
            task: Kepala
            output_dir: kepala

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Assemble debug flavor
        run: ./gradlew :app:assemble${{ matrix.task }}Debug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gas-${{ matrix.output_dir }}-debug
          path: app/build/outputs/apk/${{ matrix.output_dir }}/debug/*.apk
          retention-days: 7

  check-docs:
    name: Verify build notes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required documentation updates
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_BRANCH
          CHANGED_FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD)
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -q "Apk Release/Pegangan Build APK/GAS/BUILD_LOG.md"; then
            echo "BUILD_LOG.md wajib ikut diperbarui saat perubahan APK GAS."
            exit 1
          fi

          if echo "$CHANGED_FILES" | grep -q "native-mobile-gas/"; then
            if ! echo "$CHANGED_FILES" | grep -q "Apk Release/Pegangan Build APK/GAS/CHANGELOG.md"; then
              echo "Perubahan native-mobile-gas wajib memeriksa apakah CHANGELOG.md perlu diupdate."
            fi
          fi
