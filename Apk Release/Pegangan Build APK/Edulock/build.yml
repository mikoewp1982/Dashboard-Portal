name: EduLock Build Reference

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Student debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Assemble debug variant
        run: ./gradlew :app:assembleStudentDebug --stacktrace

  check-docs:
    name: Verify build notes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check BUILD_LOG update
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_BRANCH
          CHANGED_FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD)
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -q "Apk Release/Pegangan Build APK/Edulock/BUILD_LOG.md"; then
            echo "BUILD_LOG.md wajib ikut diperbarui saat perubahan APK EduLock."
            exit 1
          fi
