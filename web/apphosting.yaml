# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
framework: nextjs

runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# Optional: inject Admin SDK private key so /api/teacher/login can mint customToken
# locally (no IAM signBlob). Not required — login also returns a server-side
# Identity Toolkit session that the browser persists when client Auth XHR fails.
# env:
#   - variable: FIREBASE_SERVICE_ACCOUNT_KEY
#     secret: FIREBASE_SERVICE_ACCOUNT_KEY
#     availability:
#       - RUNTIME
#
# Create the secret (do NOT commit service-account.json):
#   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY --data-file service-account.json --force
